<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form Contact</title>
  <link rel="stylesheet" href="style4.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  
  <nav>
    <div class="logo">
      <img src="logo.png" alt="logo" width="30px">
      <h1>Swimming Club</h1>
    </div>
    <div class="nav-right">
      <a href="home.html" onclick="showPage('home')">Home</a>
      <a href="about.html" onclick="showPage('about')">About</a>
      <a href="activity.html" onclick="showPage('activity')">Activity</a>
      <a href="contact.html" onclick="showPage('contact')">Contact</a>
    </div>
    </div>
  </nav>

  <main>
    <section class="container">
      <div class="form-container">
        <h2>Let's Join Now!</h2>
        <form action="#" method="post" class="contact-form">
          <label for="nama">Nama:</label>
          <input type="text" id="nama" name="nama" required>
    
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
    
          <label for="pesan">Pesan:</label>
          <textarea id="pesan" name="pesan" rows="5" required></textarea>
    
          <button type="submit">Kirim</button>
        </form>

      </div>
    </section>

    <section class="sosmed-section">
    
      <div class="ikon">
        <div class="ikon-name">
          <a href="https://instagram.com/programmingclub" target="_blank"><i class="fab fa-instagram"></i></a>
          <span>@swimmingclub</span>
        </div>
        <div class="ikon-name">
          <a href="https://facebook.com/programmingclub" target="_blank"><i class="fab fa-facebook"></i></a>
          <span>SwimmingClub</span>
        </div>
        <div class="ikon-name">
          <a href="mailto:programmingclub@kampus.ac.id"><i class="fas fa-envelope"></i></a>
          <span>swimmingclub@gmail.com</span>
        </div>
      </div>
    </section>
  </main>
  
  <footer>
    © 2025 Swimming Club. All Rights Reserved.
  </footer>
</body>
</html>
